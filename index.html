<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Formation Mastery - Ms Ngoc Hai FTU</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --purple: #8854C0;
            --yellow: #FDCB6E;
            --mint: #00C9A7;
            --correct: #00D26A;
            --wrong: #FF4757;
            --dark: #2D3436;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            font-family: 'Quicksand', 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0; padding: 0;
            min-height: 100vh;
            background: linear-gradient(-45deg, var(--purple), var(--mint), var(--yellow), #E84393);
            background-size: 400% 400%;
            animation: loangMauBG 12s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 60px;
        }

        @keyframes loangMauBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Lớp họa tiết quả cây, ngôi sao, mèo con lơ lửng trên nền loang độc lập */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.18;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='20' cy='20' r='5' fill='%23FFF'/><path d='M50 15 L55 25 L45 25 Z' fill='%23FFF'/><text x='70' y='30' font-size='12'>🐱</text><text x='15' y='75' font-size='12'>🍓</text><text x='80' y='80' font-size='12'>⭐</text><path d='M35 45 Q 40 40, 45 45 T 55 45' fill='none' stroke='%23FFF' stroke-width='2'/></svg>");
        }

        .header-panel {
            text-align: center;
            margin: 25px 0 10px 0;
            z-index: 2;
            background: rgba(255, 255, 255, 0.25);
            padding: 8px 30px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header-panel h2 {
            margin: 0;
            font-size: 15px;
            color: #FFFFFF;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 900;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .main-container {
            width: 92%;
            max-width: 820px;
            z-index: 2;
        }

        .section-title {
            text-align: center;
            color: #FFFFFF;
            font-size: 25px;
            font-weight: 900;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        /* Quiz Card dạng thẻ bài nổi bật */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 35px;
            box-shadow: 0 12px 0 rgba(0,0,0,0.15);
            border: 4px solid var(--dark);
            position: relative;
        }

        .question-text {
            font-size: 18px;
            font-weight: 900;
            color: var(--dark);
            margin-bottom: 22px;
            line-height: 1.6;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media(min-width: 600px) {
            .options-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-button {
            background: #FFFFFF;
            border: 3px solid var(--dark);
            border-radius: 18px;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            color: var(--dark);
            box-shadow: 0 6px 0 var(--dark);
            transition: all 0.1s ease;
            text-align: left;
            position: relative;
            top: 0;
        }

        .option-button:hover:not(.disabled) {
            transform: scale(1.025);
            background: #FFF9E6;
        }

        .option-button:active:not(.disabled) {
            top: 4px;
            box-shadow: 0 2px 0 var(--dark);
        }

        .option-button.correct {
            background-color: var(--correct) !important;
            color: white !important;
            box-shadow: 0 6px 0 #00A352 !important;
            border-color: var(--dark) !important;
        }

        .option-button.wrong {
            background-color: var(--wrong) !important;
            color: white !important;
            box-shadow: 0 6px 0 #CC3240 !important;
            border-color: var(--dark) !important;
        }

        .option-button.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .explanation-container {
            margin-top: 25px;
            padding: 20px;
            background-color: #FFFDE7;
            border: 3px solid var(--dark);
            border-radius: 18px;
            box-shadow: inset 0 4px 0 rgba(0,0,0,0.05);
            display: none;
            animation: expandSlow 0.3s ease-out forwards;
        }

        @keyframes expandSlow {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .exp-title {
            font-weight: 900;
            font-size: 15px;
            color: #D35400;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exp-step {
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.5;
            color: var(--dark);
            font-weight: 500;
        }

        .exp-step strong {
            color: var(--purple);
            font-weight: 700;
        }

        .shake-animation {
            animation: shakeEffect 0.4s ease-in-out;
        }

        @keyframes shakeEffect {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .submit-bar {
            text-align: center;
            margin: 40px 0;
        }

        .big-submit-btn {
            background-color: #FF7675;
            color: white;
            border: 4px solid var(--dark);
            border-radius: 50px;
            padding: 18px 50px;
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 0 var(--dark);
            position: relative;
            top: 0;
            transition: all 0.1s;
        }

        .big-submit-btn:hover {
            transform: scale(1.05);
            background-color: #ff5e5d;
        }

        .big-submit-btn:active {
            top: 6px;
            box-shadow: 0 4px 0 var(--dark);
        }

        .custom-popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .custom-popup-box {
            background: #FFFFFF;
            border: 4px solid var(--dark);
            border-radius: 28px;
            padding: 35px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 0 rgba(0,0,0,0.2);
            animation: popUpAnim 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .popup-score {
            font-size: 50px;
            font-weight: 900;
            color: #8854C0;
            margin: 15px 0;
        }

        .popup-comment {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .popup-close-btn {
            background: var(--mint);
            color: white;
            border: 3px solid var(--dark);
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--dark);
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <h2>Giáo viên tạo: Ms Ngoc Hai FTU</h2>
    </div>

    <div class="main-container">
        <h1 class="section-title">🚀 WORD FORMATION ADVANCED TEST 🎯</h1>
        <div id="quiz-area-container"></div>

        <div class="submit-bar">
            <button class="big-submit-btn" onclick="submitExam()">NỘP BÀI THI 🎉</button>
        </div>
    </div>

    <div class="custom-popup-overlay" id="result-popup">
        <div class="custom-popup-box">
            <h2 style="margin-top:0; font-weight:900; color:var(--dark);">BÀI THI HOÀN THÀNH!</h2>
            <div class="popup-score" id="popup-score-text">0/15</div>
            <div class="popup-comment" id="popup-comment-text">Lời nhận xét động viên ở đây!</div>
            <button class="popup-close-btn" onclick="closePopup()">XEM LẠI BÀI LÀM 📝</button>
        </div>
    </div>

    <script>
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            try {
                if (type === 'correct') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain); gain.connect(audioContext.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioContext.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                    osc.start(); osc.stop(audioContext.currentTime + 0.4);
                } else {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain); gain.connect(audioContext.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioContext.currentTime);
                    osc.frequency.setValueAtTime(120, audioContext.currentTime + 0.15);
                    osc.frequency.setValueAtTime(90, audioContext.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                    osc.start(); osc.stop(audioContext.currentTime + 0.4);
                }
            } catch (e) { console.log("Audio contextual issue"); }
        }

        const questionsData = [
            {
                id: 1,
                q: "The heavy rain caused a __________ flow of water down the mountain, flooding the valley below.",
                options: ["continual", "continuation", "continuous", "continuity"],
                correct: "continuous",
                explain: {
                    trans: "Trận mưa lớn đã tạo ra một dòng nước chảy liên tục không ngắt quãng từ trên núi xuống, làm ngập lụt thung lũng bên dưới.",
                    opts: [
                        "A. continual (adj): liên miên, lặp đi lặp lại nhiều lần có ngắt quãng ngắt đoạn.",
                        "B. continuation (n): sự tiếp tục, phần tiếp nối.",
                        "C. continuous (adj): liên tục, liên hàm kéo dài không hề bị đứt đoạn hay ngắt quãng về cả thời gian lẫn không gian.",
                        "D. continuity (n): tính liên tục."
                    ],
                    why: "Vị trí trước danh từ 'flow' (dòng chảy) cần một tính từ bổ nghĩa. Xét về tính chất vật lý của dòng nước chảy xiết từ trên núi xuống gây ngập lụt, nó mang đặc tính liên tục kéo dài không đứt quãng, do đó tính từ 'continuous' là lựa chọn chuẩn xác nhất.",
                    wrong: "A sai vì mang ý nghĩa lặp đi lặp lại có khoảng ngừng; B và D sai từ loại ngữ pháp."
                }
            },
            {
                id: 2,
                q: "As the main highway was closed due to a landslide, drivers had to look for alternative routes.",
                options: ["alternatives", "alternations", "alternates", "alternative"],
                correct: "alternative",
                explain: {
                    trans: "Vì đường cao tốc chính bị đóng cửa do sạt lở đất, các tài xế đã phải tìm kiếm các lộ trình thay thế khác.",
                    opts: [
                        "A. alternatives (n): các sự lựa chọn thay thế khác.",
                        "B. alternations (n): sự xen kẽ, sự luân phiên.",
                        "C. alternates (v/n): luân phiên / người thay thế.",
                        "D. alternative (adj): có tính chất thay thế, phương án khác."
                    ],
                    why: "Đứng trước danh từ chính số nhiều 'routes' (các tuyến đường/lộ trình) cần một tính từ bổ nghĩa cho nó tạo thành cụm danh từ ghép. Tính từ 'alternative' mang ý nghĩa là lộ trình dự phòng, thay thế hoàn toàn thích hợp.",
                    wrong: "A, B, C đều đóng vai trò danh từ hoặc động từ nên vi phạm quy tắc cú pháp ngữ pháp đứng trước danh từ chính."
                }
            },
            {
                id: 3,
                q: "The city plans to phase out diesel trains and replace them entirely with an __________ network by 2030.",
                options: ["electrician", "electrified", "electricity", "electrifying"],
                correct: "electrified",
                explain: {
                    trans: "Thành phố có kế hoạch loại bỏ dần các đoàn tàu chạy bằng dầu diesel và thay thế chúng hoàn toàn bằng một mạng lưới đường sắt đã được điện khí hóa vào năm 2030.",
                    opts: [
                        "A. electrician (n): thợ điện.",
                        "B. electrified (adj/V-ed): đã được điện khí hóa, được cung cấp điện.",
                        "C. electricity (n): dòng điện, điện năng.",
                        "D. electrifying (adj): cực kỳ lý thú, gây sốc hứng khởi."
                    ],
                    why: "Vị trí đứng trước danh từ 'network' (mạng lưới) và đứng sau mạo từ 'an' cần một tính từ/phân từ bổ nghĩa. Xét về ngữ cảnh thay thế tàu chạy dầu diesel, mạng lưới đường tàu phải được nâng cấp lắp đặt hệ thống điện, tức là 'electrified network'.",
                    wrong: "A và C sai loại từ; D mang ý nghĩa ẩn dụ chỉ một sự kiện hoặc màn trình diễn bùng nổ, không đi với mạng lưới kỹ thuật đường sắt."
                }
            },
            {
                id: 4,
                q: "Freelance designers enjoy __________ working hours, allowing them to balance work and family life easily.",
                options: ["flexibility", "inflexibility", "inflexible", "flexible"],
                correct: "flexible",
                explain: {
                    trans: "Các nhà thiết kế tự do được tận hưởng giờ làm việc linh hoạt, điều này cho phép họ cân bằng giữa công việc và cuộc sống gia đình một cách dễ dàng.",
                    opts: [
                        "A. flexibility (n): tính linh hoạt.",
                        "B. inflexibility (n): tính cứng nhắc.",
                        "C. inflexible (adj): cứng nhắc, không linh hoạt.",
                        "D. flexible (adj): linh hoạt, cơ động."
                    ],
                    why: "Đứng trước cụm danh từ tân ngữ 'working hours' (giờ làm việc) cần một tính từ bổ nghĩa. Ý nghĩa câu mang tính chất tích cực giúp cân bằng cuộc sống (*balance work and family*) nên ta chọn tính từ chỉ sự linh động 'flexible'.",
                    wrong: "A và B sai từ loại; C mang nghĩa tiêu cực cứng nhắc, mâu thuẫn hoàn toàn với lợi ích của công việc tự do đề bài mô tả."
                }
            },
            {
                id: 5,
                q: "The factory is looking to find a suitable __________ for the damaged machinery before production halts.",
                options: ["placing", "placement", "replacement", "replaceable"],
                correct: "replacement",
                explain: {
                    trans: "Nhà máy đang tìm kiếm một sự thay thế thích hợp cho bộ phận máy móc bị hư hỏng trước khi quá trình sản xuất bị đình trệ.",
                    opts: [
                        "A. placing (n/V-ing): hành động đặt để.",
                        "B. placement (n): sự sắp xếp việc làm, chỗ thực tập.",
                        "C. replacement (n): sự thay thế, vật thay thế hoặc linh kiện thay thế.",
                        "D. replaceable (adj): có thể thay thế được."
                    ],
                    why: "Vị trí đứng sau mạo từ 'a' và tính từ 'suitable' chắc chắn cần một danh từ cốt lõi. Trong ngữ cảnh máy móc bị hỏng hóc nặng (*damaged machinery*), việc cần làm là tìm linh kiện hoặc bộ máy khác thế chỗ vào, tức là chọn danh từ 'replacement'.",
                    wrong: "A và B sai ngữ nghĩa bối cảnh kỹ thuật nhà máy; D sai từ loại ngữ pháp."
                }
            },
            {
                id: 6,
                q: "After losing everything in the fire, the family moved to a new town to forget the past and start __________.",
                options: ["anew", "newly", "newness", "renewal"],
                correct: "anew",
                explain: {
                    trans: "Sau khi mất đi tất cả mọi thứ trong vụ hỏa hoạn, gia đình ấy đã chuyển đến một thị trấn mới để quên đi quá khứ và bắt đầu lại từ đầu.",
                    opts: [
                        "A. anew (adv): bắt đầu lại từ đầu, theo một cách hoàn toàn mới (thường đi với động từ start).",
                        "B. newly (adv): gần đây, vừa mới diễn ra.",
                        "C. newness (n): tính chất mới mẻ.",
                        "D. renewal (n): sự gia hạn, sự đổi mới thủ tục văn bản."
                    ],
                    why: "Cụm cấu trúc kết hợp từ vựng cố định kinh điển trong tiếng Anh học thuật: 'start anew' mang ý nghĩa biểu thị sự rũ bỏ quá khứ đau buồn để xây dựng, khởi đầu lại cuộc sống hoàn toàn mới từ con số không.",
                    wrong: "Học sinh rất dễ bị đánh lừa chọn trạng từ 'newly' theo thói quen cấu trúc thông thường, tuy nhiên 'newly' chỉ trạng thái vừa mới hoàn thành, không đi với động từ 'start' tạo nghĩa khởi đầu lại như 'anew'."
                }
            },
            {
                id: 7,
                q: "These two computer cables look different, but their functions are actually completely __________.",
                options: ["exchange", "interchangeable", "changeover", "unchanging"],
                correct: "interchangeable",
                explain: {
                    trans: "Hai sợi cáp máy tính này trông có vẻ khác nhau, nhưng các chức năng của chúng trên thực tế lại hoàn toàn có thể hoán đổi cho nhau.",
                    opts: [
                        "A. exchange (v/n): trao đổi.",
                        "B. interchangeable (adj): có thể thay thế, hoán đổi vị trí/công năng qua lại cho nhau mà không gây ảnh hưởng.",
                        "C. changeover (n): sự chuyển đổi hệ thống.",
                        "D. unchanging (adj): không thay đổi."
                    ],
                    why: "Vị trí đứng sau hệ từ nối 'are' và trạng từ chỉ mức độ tuyệt đối 'completely' bắt buộc phải điền một tính từ. Hai chiếc cáp công nghệ tuy ngoại hình khác biệt nhưng cắm thay thế cho nhau được, áp dụng tính từ 'interchangeable'.",
                    wrong: "A và C sai từ loại; D mang nghĩa tĩnh giữ nguyên không làm bật lên tính chất công năng tương thích lẫn nhau của hai thiết bị điện tử."
                }
            },
            {
                id: 8,
                q: "I couldn't get a single wink of sleep last night because of the __________ buzzing sound of the air conditioner.",
                options: ["continual", "continuation", "continuous", "continuously"],
                correct: "continual",
                explain: {
                    trans: "Đêm qua tôi không thể chợp mắt lấy một phút nào vì tiếng kêu vo ve lặp đi lặp lại liên miên của chiếc máy điều hòa.",
                    opts: [
                        "A. continual (adj): liên miên, lặp đi lặp lại gây khó chịu (có khoảng ngắt quãng nhỏ bộc phát).",
                        "B. continuation (n): sự tiếp nối.",
                        "C. continuous (adj): liên tục không ngừng một giây nào (về mặt vật lý dòng chảy/thời gian).",
                        "D. continuously (adv): một cách liên tục."
                    ],
                    why: "Vị trí trước cụm danh từ 'buzzing sound' cần tính từ bổ nghĩa. Tiếng máy móc hỏng hóc kêu vo ve lặp đi lặp lại từng hồi gây phiền toái, bực mình cho người ngủ thường đi với tính từ đặc tả 'continual'.",
                    wrong: "B và d sai từ loại; C thiên về tính liên tục tuyệt đối không ngắt quãng của chuỗi thời gian hoặc đường thẳng địa lý."
                }
            },
            {
                id: 9,
                q: "The invention of the microchip was a __________ breakthrough that paved the way for modern computing.",
                options: ["revolutionary", "revolutionise", "revolutionist", "revolting"],
                correct: "revolutionary",
                explain: {
                    trans: "Sự phát minh ra vi mạch là một bước đột phá mang tính cách mạng, mở đường cho nền tin học hiện đại.",
                    opts: [
                        "A. revolutionary (adj): mang tính cách mạng, làm thay đổi hoàn toàn lịch sử cục diện.",
                        "B. revolutionise (v): cách mạng hóa.",
                        "C. revolutionist (n): nhà cách mạng.",
                        "D. revolting (adj): kinh tởm, ghê tởm."
                    ],
                    why: "Đứng trước danh từ 'breakthrough' (bước đột phá) cần điền một tính từ bổ nghĩa. Phát minh vi mạch đổi mới thời đại là bước tiến mang tính chất cách mạng vĩ đại, tương thích tính từ 'revolutionary'.",
                    wrong: "B và C sai từ loại; D mang ý nghĩa xúc phạm, tồi tệ hôi thối, hoàn toàn lạc lõng nghĩa bối cảnh."
                }
            },
            {
                id: 10,
                q: "You might need to make a slight __________ to the camera lens focus to get a sharper image in low light.",
                options: ["adjustable", "adjustment", "readjust", "adjusted"],
                correct: "adjustment",
                explain: {
                    trans: "Bạn có thể cần phải thực hiện một sự điều chỉnh nhỏ đối với tiêu cự ống kính máy ảnh để có được hình ảnh sắc nét hơn trong điều kiện thiếu sáng.",
                    opts: [
                        "A. adjustable (adj): có thể căn chỉnh được.",
                        "B. adjustment (n): sự điều chỉnh, hành vi tinh chỉnh thông số.",
                        "C. readjust (v): tái điều chỉnh lại.",
                        "D. adjusted (V-ed): đã được chỉnh."
                    ],
                    why: "Cấu trúc cụm động từ đi liền nhau (collocation) với động từ 'make': 'make an adjustment to something' có nghĩa là tiến hành thực hiện một sự điều chỉnh thông số cho phù hợp hoàn cảnh.",
                    wrong: "Các phương án tính từ và động từ A, C, D đều vi phạm quy tắc danh từ đứng sau tính từ bổ nghĩa 'slight'."
                }
            },
            {
                id: 11,
                q: "Nutritionists often warn against consuming too much __________ food as it contains high levels of sodium.",
                options: ["processor", "processing", "processed", "process"],
                correct: "processed",
                explain: {
                    trans: "Các chuyên gia dinh dưỡng thường cảnh báo chống lại việc tiêu thụ quá nhiều thực phẩm đã qua chế biến sẵn vì nó chứa hàm lượng natri cao.",
                    opts: [
                        "A. processor (n): bộ vi xử lý máy tính / máy chế biến đồ ăn.",
                        "B. processing (n/V-ing): sự chế biến, quy trình xử lý dữ liệu.",
                        "C. processed (adj/V-ed): đã qua chế biến, được đóng hộp xử lý công nghiệp.",
                        "D. process (n/v): quy trình / xử lý."
                    ],
                    why: "Đứng trước danh từ 'food' (thực phẩm) cần tính từ/phân từ bổ nghĩa tạo danh từ ghép. Khái niệm đồ ăn đóng hộp, được làm sẵn qua nhà máy công nghiệp trong tiếng Anh luôn dùng cấu trúc 'processed food'.",
                    wrong: "A là danh từ chỉ công cụ máy móc thiết bị phần cứng; B và D sai cấu trúc kết hợp từ vựng."
                }
            },
            {
                id: 12,
                q: "The country aims to generate 80% of its electricity from __________ sources like wind and solar power.",
                options: ["renewable", "renewal", "renewed", "newly"],
                correct: "renewable",
                explain: {
                    trans: "Quốc gia này đặt mục tiêu sản xuất 80% lượng điện năng từ các nguồn năng lượng tái tạo như năng lượng gió và năng lượng mặt trời.",
                    opts: [
                        "A. renewable (adj): có khả năng tự tái tạo, năng lượng vô hạn (renewable sources).",
                        "B. renewal (n): sự gia hạn giấy tờ.",
                        "C. renewed (V-ed): được làm mới, hồi sinh cảm xúc.",
                        "D. newly (adv): vừa mới."
                    ],
                    why: "Thuật ngữ môi trường học thuật cố định đi với danh từ 'sources' đứng sau các ví dụ điện gió, điện mặt trời luôn là cụm danh từ ghép 'renewable sources / renewable energy' (năng lượng tái tạo).",
                    wrong: "B sai từ loại; C và D sai lệch hoàn toàn bản chất công nghệ kỹ thuật năng lượng."
                }
            },
            {
                id: 13,
                q: "The company policy is so __________ that managers are not allowed to make any exceptions, even in emergencies.",
                options: ["flexible", "flexibility", "inflexibility", "inflexible"],
                correct: "inflexible",
                explain: {
                    trans: "Chính sách của công ty cứng nhắc đến mức các quản lý không được phép đưa ra bất kỳ ngoại lệ nào, ngay cả trong những trường hợp khẩn cấp.",
                    opts: [
                        "A. flexible (adj): linh hoạt.",
                        "B. flexibility (n): tính linh động.",
                        "C. inflexibility (n): sự cứng nhắc.",
                        "D. inflexible (adj): cứng nhắc, bất di bất dịch, không thể lay chuyển."
                    ],
                    why: "Cấu trúc nhấn mạnh kết quả: 'so + adj + that'. Cần điền một tính từ sau chữ 'so'. Thông tin vế sau chỉ ra người quản lý tuyệt đối không được phép châm chước linh hoạt giải quyết dù khẩn cấp (*not allowed to make exceptions*), chứng tỏ nội quy này vô cùng cứng nhắc 'inflexible'.",
                    wrong: "A ngược nghĩa hoàn toàn bối cảnh câu; B và C sai từ loại ngữ pháp."
                }
            },
            {
                id: 14,
                q: "He handles criticism with great __________, never getting angry and always looking for ways to improve.",
                options: ["mature", "maturity", "immature", "maturation"],
                correct: "maturity",
                explain: {
                    trans: "Anh ấy đối mặt xử lý những lời chỉ trích với một sự trưởng thành/chín chắn tuyệt vời, không bao giờ nổi giận và luôn tìm cách để tiến bộ.",
                    opts: [
                        "A. mature (adj): chín chắn, trưởng thành.",
                        "B. maturity (n): sự trưởng thành, sự chín chắn trong tư duy.",
                        "C. immature (adj): non nớt, trẻ con.",
                        "D. maturation (n): quá trình mưng mủ / quá trình phát triển sinh học cơ thể."
                    ],
                    why: "Đứng sau tính từ 'great' cần một danh từ trừu tượng đóng vai trò tân ngữ cho giới từ 'with'. Phẩm chất điềm tĩnh tiếp thu chỉ trích không nổi giận (*never getting angry*) thể hiện sự chín chắn tư duy, áp dụng danh từ 'maturity'.",
                    wrong: "A và C sai từ loại; D chỉ sự phát triển thể chất tế bào sinh học, không dùng cho tâm lý hành vi giao tiếp xã hội."
                }
            },
            {
                id: 15,
                q: "Many people find comfort in religion because it provides a set of __________ moral truths in a changing world.",
                options: ["changeless", "exchangeable", "unchangeable", "unchanging"],
                correct: "unchanging",
                explain: {
                    trans: "Nhiều người tìm thấy sự an ủi trong tôn giáo bởi vì nó cung cấp một hệ thống các chân lý đạo đức bất biến, không bao giờ thay đổi trong một thế giới đầy biến động.",
                    opts: [
                        "A. changeless (adj): không thay đổi (thường dùng cho trạng thái tĩnh vô tri).",
                        "B. exchangeable (adj): có thể trao đổi buôn bán.",
                        "C. unchangeable (adj): không thể sửa đổi (dùng cho quyết định/luật lệ).",
                        "D. unchanging (adj): bất biến, luôn giữ nguyên bản chất trường tồn theo thời gian (đi với cụm 'moral truths')."
                    ],
                    why: "Đứng trước cụm danh từ 'moral truths' (các chân lý đạo đức) cần một tính từ bổ nghĩa. Đối lập với một thế giới đầy sự xoay vần biến động không ngừng (*a changing world*) là những giá trị đạo đức có tính chất bất biến trường tồn, thuật ngữ triết học/ngôn ngữ học luôn là 'unchanging moral truths'.",
                    wrong: "A và C ít dùng và lệch collocations học thuật khi đi kèm bổ trợ cho chân lý đạo đức vĩ mô; B sai nghĩa."
                }
            }
        ];

        function shuffleOptionsArray(array) {
            let current = [...array];
            for (let i = current.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [current[i], current[j]] = [current[j], current[i]];
            }
            return current;
        }

        let answeredCount = 0;
        let correctAnswersCount = 0;
        let userAnswersMap = {};

        function renderWordFormationQuiz() {
            const container = document.getElementById('quiz-area-container');
            container.innerHTML = "";

            questionsData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.id = `wf-card-${index}`;

                // Tráo trộn ngẫu nhiên danh sách đáp án phái sinh từ loại
                let shuffledPool = shuffleOptionsArray(item.options);

                let buttonsMarkup = shuffledPool.map(opt => `
                    <button class="option-button" onclick="submitSelectedWord(${index}, '${opt}', this)">
                        ${opt}
                    </button>
                `).join('');

                card.innerHTML = `
                    <div class="question-text">Câu hỏi ${item.id}: ${item.q}</div>
                    <div class="options-container">${buttonsMarkup}</div>
                    <div class="explanation-container" id="exp-wf-${index}">
                        <div class="exp-title">💡 PHÂN TÍCH CHUYÊN SÂU TỪ MS NGOC HAI FTU:</div>
                        <div class="exp-step"><strong>Bước 1 (Dịch nghĩa toàn câu):</strong> ${item.explain.trans}</div>
                        <div class="exp-step"><strong>Bước 2 (Giải nghĩa các từ loại phái sinh):</strong><br>${item.explain.opts.join('<br>')}</div>
                        <div class="exp-step"><strong>Bước 3 (Vì sao chọn từ loại này?):</strong> ${item.explain.why}</div>
                        <div class="exp-step"><strong>Bước 4 (Vì sao các từ loại khác SAI?):</strong> ${item.explain.wrong}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function submitSelectedWord(idx, selectedValue, btnElement) {
            const card = document.getElementById(`wf-card-${idx}`);
            if (card.dataset.done === "true") return;
            card.dataset.done = "true";
            
            const explanationPanel = document.getElementById(`exp-wf-${idx}`);
            const siblingButtons = card.querySelectorAll('.option-button');

            userAnswersMap[idx] = selectedValue;
            answeredCount++;
            explanationPanel.style.display = "block";

            // Khóa tương tác tất cả nút trong card này
            siblingButtons.forEach(btn => btn.classList.add('disabled'));

            const correctValue = questionsData[idx].correct;
            if (selectedValue === correctValue) {
                btnElement.classList.add('correct');
                correctAnswersCount++;
                playSound('correct');
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.75 },
                    colors: ['#8854C0', '#FDCB6E', '#00C9A7']
                });
            } else {
                btnElement.classList.add('wrong');
                card.classList.add('shake-animation');
                playSound('wrong');
                
                // Tự động tìm hiển thị màu xanh lá làm nổi bật cho đáp án đúng gốc để học sinh đối chiếu
                siblingButtons.forEach(btn => {
                    if (btn.innerText === correctValue) {
                        btn.classList.add('correct');
                    }
                });
                
                setTimeout(() => card.classList.remove('shake-animation'), 400);
            }
        }

        window.submitExam = function() {
            if (answeredCount < questionsData.length) {
                if (!confirm("Các em chưa điền hết tất cả các câu từ loại đâu nè. Có chắc chắn muốn nộp bài tổng kết ngay không?")) return;
            }

            const modal = document.getElementById('result-popup');
            document.getElementById('popup-score-text').innerText = `${correctAnswersCount}/${questionsData.length}`;
            const comment = document.getElementById('popup-comment-text');

            if (correctAnswersCount === questionsData.length) {
                comment.innerText = "Quá xuất sắc! Em xứng đáng đạt điểm 10 tuyệt đối chuyên sâu về Word Formation của cô Ngọc Hải FTU! 👑🥇✨";
            } else if (correctAnswersCount >= 11) {
                comment.innerText = "Làm bài rất giỏi! Khả năng nhận diện hậu tố và tiền tố từ loại của em cực kỳ vững chắc! 🌟🎉";
            } else if (correctAnswersCount >= 7) {
                comment.innerText = "Khá tốt! Em hãy rà soát thật kỹ lại nội dung giải thích chi tiết 4 bước cô viết ở các câu làm sai nhé! 💪📚";
            } else {
                comment.innerText = "Đừng nản lòng em nhé! Cấu trúc biến đổi từ loại nâng cao cần tích lũy. Thử sức lại lần nữa nha! Cô luôn tin em! 💖⭐";
            }

            modal.style.display = "flex";
        }

        window.closePopup = function() {
            document.getElementById('result-popup').style.display = "none";
        }

        renderWordFormationQuiz();
    </script>
